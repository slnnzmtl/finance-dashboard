services:
  app:
    build: .
    container_name: finance-dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
      NUXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
      NUXT_PUBLIC_SUPABASE_KEY: ${SUPABASE_KEY}
      NUXT_PUBLIC_ALLOWED_EMAILS: ${ALLOWED_EMAILS}
    ports:
      - "127.0.0.1:3010:3000"
